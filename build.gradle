plugins {
	id 'java-library'
	id("com.gradleup.shadow") version "9.3.0"
	id 'eclipse'
}

group = 'etri'
version = System.getenv("MDT_BUILD_VERSION") ?: "unknown"

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}
tasks.withType(JavaCompile) {
	options.encoding = 'UTF-8'
}

sourceSets {
	main {
		java {
			srcDirs = [
				'src/main/java',
				'src/main/api',
				'src/main/antlr'
			]
			
			// .antlr 디렉토리를 명시적으로 제외 (ANTLR 생성 파일)
			exclude '**/.antlr/**'
		}
	}
}

repositories {
	mavenCentral()
}

dependencies {
	api project(":utils")
	
	// @Nullable
	compileOnly libs.jetbrains.annotations
	// @GuardedBy
	compileOnly libs.findbugs.jsr305

	// Lombok (from the project :utils)
	compileOnly libs.lombok
	annotationProcessor libs.lombok
	
	// Logback
	api libs.slf4j.api

	// logback with SLF4j (from the project :utils)
	implementation libs.logback.classic

	// Apache POI(aas4j-dataformat-aasx 경유)가 사용하는 Log4j2 API 로그를 SLF4J(→ Logback)로 라우팅한다.
	// 이 브리지가 없으면 "Log4j API could not find a logging provider" 오류가 발생한다.
	runtimeOnly libs.log4j.to.slf4j

	// AAS model
	api libs.aas4j.dataformat.json
	api libs.aas4j.dataformat.aasx
	
	implementation libs.commons.beanutils
	implementation libs.commons.logging
		
	// HTTP Client
	implementation libs.okhttp
	
	// jackson 
	implementation libs.jackson.databind
	implementation libs.jackson.datatype.jsr310
	implementation libs.jackson.dataformat.yaml
	
	// Tika
	implementation libs.tika.core
	
	// MQTT
	implementation libs.paho.mqttv3
	
	// Antlr
	implementation libs.antlr4.runtime

	// test (JUnit 5 / Jupiter)
	testImplementation libs.junit.jupiter
	testRuntimeOnly libs.junit.platform.launcher
	testImplementation libs.mockito.core
	testImplementation libs.mockito.junit.jupiter
}

tasks.named('test') {
	useJUnitPlatform()
	jvmArgs '--add-opens=java.base/java.lang=ALL-UNNAMED'
}

jar {
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	// 의존 프로젝트의 logback-test.xml / logback-spring.xml은 jar에 포함하지 않는다.
	// (이 프로젝트의 logback.xml은 그대로 포함된다.)
	exclude 'logback-test.xml'
	exclude 'logback-spring.xml'
}

eclipse {
	classpath {
		file {
			whenMerged { cp ->
				def linkedProjectBuildLibDirs = [
					project(':utils').projectDir.toPath().resolve('build/libs').toUri().getPath().replaceAll('/+$', '')
				]
				cp.entries.removeAll { entry ->
					entry.kind == 'lib'
						&& entry.path != null
						&& linkedProjectBuildLibDirs.any { dir -> entry.path.startsWith(dir + '/') }
				}
				cp.entries.each { entry ->
					if (entry.kind == 'src' && entry.path == 'src/main/resources') {
						entry.excludes = []
					}
					if (entry.kind == 'src' && entry.path == 'src/test/resources') {
						entry.excludes = []
					}
				}
			}
		}
	}
}