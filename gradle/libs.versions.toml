# MDT 프로젝트들이 함께 쓰는 라이브러리 버전.
#
# mdt-client와 함께 빌드되는 MDT 저장소들은 settings.gradle에서 이 파일을 카탈로그 'libs'로 읽는다.
#     dependencyResolutionManagement {
#         versionCatalogs { libs { from(files('../mdt-client/gradle/libs.versions.toml')) } }
#     }
# utils(common/utils)는 MDT 밖의 프로젝트도 함께 빌드하므로 이 카탈로그를 쓰지 않고 자체 ext에 버전을 둔다.
# 버전을 바꿀 때는 utils/build.gradle의 같은 라이브러리 버전도 함께 맞춘다.

[versions]
slf4j = "2.0.17"
logback = "1.5.20"
log4j = "2.24.3"
lombok = "1.18.46"
jackson = "2.20.0"
okhttp = "4.12.0"
aas4j = "1.0.5"
antlr = "4.13.2"
paho = "1.2.5"
tika = "3.3.3"
commons-beanutils = "1.11.0"
commons-logging = "1.3.6"
jetbrains-annotations = "24.1.0"
findbugs-jsr305 = "3.0.2"
junit-jupiter = "5.10.2"
mockito = "5.17.0"

[libraries]
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
log4j-to-slf4j = { module = "org.apache.logging.log4j:log4j-to-slf4j", version.ref = "log4j" }
lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }

jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
jackson-datatype-jsr310 = { module = "com.fasterxml.jackson.datatype:jackson-datatype-jsr310", version.ref = "jackson" }
jackson-dataformat-yaml = { module = "com.fasterxml.jackson.dataformat:jackson-dataformat-yaml", version.ref = "jackson" }

okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "okhttp" }

aas4j-dataformat-json = { module = "org.eclipse.digitaltwin.aas4j:aas4j-dataformat-json", version.ref = "aas4j" }
aas4j-dataformat-aasx = { module = "org.eclipse.digitaltwin.aas4j:aas4j-dataformat-aasx", version.ref = "aas4j" }
aas4j-model = { module = "org.eclipse.digitaltwin.aas4j:aas4j-model", version.ref = "aas4j" }

antlr4-runtime = { module = "org.antlr:antlr4-runtime", version.ref = "antlr" }
paho-mqttv3 = { module = "org.eclipse.paho:org.eclipse.paho.client.mqttv3", version.ref = "paho" }
tika-core = { module = "org.apache.tika:tika-core", version.ref = "tika" }
commons-beanutils = { module = "commons-beanutils:commons-beanutils", version.ref = "commons-beanutils" }
commons-logging = { module = "commons-logging:commons-logging", version.ref = "commons-logging" }

jetbrains-annotations = { module = "org.jetbrains:annotations", version.ref = "jetbrains-annotations" }
findbugs-jsr305 = { module = "com.google.code.findbugs:jsr305", version.ref = "findbugs-jsr305" }

junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }
mockito-junit-jupiter = { module = "org.mockito:mockito-junit-jupiter", version.ref = "mockito" }
